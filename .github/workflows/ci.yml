name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel in-flight runs for the same ref (e.g. successive pushes on a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint, build, size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # node_modules itself, not npm's download cache: a hit skips npm ci.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint (oxfmt + oxlint + tsc)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

  test:
    # Four runners, the files split by their time (test/sequencer.ts, test/durations.json).
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Two commits deep: a pull request is checked out at its merge commit, whose first parent
      # is the base branch's tip, and the test step diffs against that parent.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # A pull request runs only the test files whose import graph reaches a file it changes
      # (vitest --changed, diffed against the base branch's tip: HEAD^1 of the merge commit; a
      # shallow fetch of the branch itself would share no merge base with it). A change to a file
      # listed in the config's forceRerunTriggers runs them all, as does every push to master.
      - name: Test
        env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
        run: npm run test:ci -- --shard=${{ matrix.shard }}/4 $CHANGED

  # The check master's protection requires: green only when the lint and every shard are. A job
  # skipped after a failed need would count as passed, hence always() and the results read here.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Lint and every test shard passed
        run: |
          echo "lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
