<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tiny-fps</title>
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;--bg:#0b1016;--fg:#e9eef3;--muted:#8d9aa7;--card:#121a23;--field:#18222c;--line:#26323e;--accent:#f7782a;--hot:#ffb347}*{box-sizing:border-box}body{background:radial-gradient(1200px 600px at 50% -200px, #2a1a12 0%, #0000 70%), radial-gradient(900px 500px at 100% 100%, #0f2233 0%, #0000 70%), var(--bg);min-height:100vh;color:var(--fg);margin:0;font:16px/1.5 system-ui,sans-serif}main{gap:24px;max-width:1120px;margin:0 auto;padding:32px 16px 40px;display:grid}header{text-align:center;justify-items:center;gap:4px;display:grid}h1{letter-spacing:.04em;background:linear-gradient(#fe6,#f92 45%,#d21);color:#0000;filter:drop-shadow(0 0 24px #f9620055);-webkit-background-clip:text;background-clip:text;margin:0;font:900 clamp(40px,9vw,76px)/1 system-ui,sans-serif;transform:skew(-8deg)}header p{color:var(--muted);margin:0}h2,legend,.label{letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding:0;font-size:12px;font-weight:800;display:block}fieldset{border:0;min-width:0;margin:0;padding:0}form{grid-template-columns:minmax(0,1fr) 340px;align-items:start;gap:24px;display:grid}.maps{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;display:grid}.map{border:1px solid var(--line);background:var(--card);cursor:pointer;border-radius:14px;grid-template-rows:auto 1fr;transition:transform .15s,border-color .15s,box-shadow .15s,opacity .15s;display:grid;position:relative;overflow:hidden}.map:hover{border-color:#3a4a5a;transform:translateY(-2px)}.map input,.seg input{opacity:0;pointer-events:none;position:absolute}.map:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 10px 40px -12px #f7782a88}.map:has(input:focus-visible){outline:2px solid var(--hot);outline-offset:3px}.seg label:has(input:focus-visible){outline:2px solid var(--hot);outline-offset:3px}.map img{aspect-ratio:16/9;object-fit:cover;filter:saturate(.9)brightness(.85);width:100%;transition:filter .15s;display:block}.map:hover img{filter:none}.map:has(input:checked) img{filter:none}.map div{align-content:start;gap:4px;padding:12px 16px 16px;display:grid}.map strong{letter-spacing:.02em;font-size:20px;font-weight:800}.map em{letter-spacing:.08em;text-transform:uppercase;color:var(--hot);font-size:12px;font-style:normal;font-weight:700}.map p{color:var(--muted);margin:2px 0 0;font-size:14px}.map i{background:var(--accent);color:#fff;border-radius:50%;place-items:center;width:26px;height:26px;font:900 15px/1 system-ui,sans-serif;display:none;position:absolute;top:10px;right:10px}.map:has(input:checked) i{display:grid}fieldset:disabled .map,fieldset:disabled .seg{opacity:.4;cursor:not-allowed;transform:none}fieldset:disabled .map *,fieldset:disabled .seg *{cursor:not-allowed}.panel{border:1px solid var(--line);background:var(--card);border-radius:16px;gap:20px;padding:20px;display:grid;position:sticky;top:16px}.mode{grid-template-columns:auto 1fr;align-items:center;gap:0 12px;display:grid}.mode b{width:44px;height:44px;color:var(--hot);letter-spacing:.06em;background:#f7782a26;border-radius:10px;grid-row:span 2;place-items:center;font:900 14px/1 system-ui,sans-serif;display:grid}.mode strong{font-size:16px}.mode span{color:var(--muted);font-size:13px}.seg{border:1px solid var(--line);background:var(--field);border-radius:12px;grid-auto-columns:1fr;grid-auto-flow:column;gap:4px;padding:4px;display:grid}.seg label{text-align:center;min-height:40px;color:var(--muted);cursor:pointer;border-radius:8px;place-items:center;padding:4px 8px;font-size:15px;font-weight:700;transition:background .15s,color .15s;display:grid;position:relative}.seg label:hover{color:var(--fg)}.seg label:has(input:checked){background:var(--accent);color:#fff}#skill{margin-top:12px}#skill.off{opacity:.4}.level{color:var(--muted);justify-content:space-between;font-size:13px;display:flex}.level output{color:var(--hot);font-weight:800}#level{width:100%;accent-color:var(--accent);cursor:pointer;margin:4px 0 0;display:block}#level:disabled{cursor:not-allowed}.ends{letter-spacing:.06em;text-transform:uppercase;color:var(--muted);justify-content:space-between;font-size:11px;display:flex}.hint{min-height:2.8em;color:var(--muted);margin:6px 2px 0;font-size:13px;line-height:1.4}label.field{gap:0;display:grid}input:not([type=radio]),button{font:inherit;border:1px solid var(--line);background:var(--field);min-height:44px;color:var(--fg);border-radius:10px;width:100%;min-width:0;padding:6px 12px}input:focus{outline-offset:1px;outline:2px solid #f7782a88}#url{margin-top:10px}#url .label{margin-bottom:4px}.go{gap:6px;display:grid}#join{color:#fff;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:linear-gradient(#ff9a4a,#e8590c);border:0;min-height:52px;font-size:18px;font-weight:800;box-shadow:0 8px 24px -8px #e8590caa}#join:hover{filter:brightness(1.08)}#summary{text-align:center;color:var(--muted);margin:0;font-size:13px}.keys{color:var(--muted);text-align:center;margin:0;font-size:13px}kbd{border:1px solid var(--line);background:var(--field);font:inherit;color:var(--fg);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;display:inline-block}[hidden]{display:none!important}#game{position:fixed;inset:0}#bar{text-shadow:0 1px 2px #000;align-items:center;gap:12px;font-size:14px;display:flex;position:fixed;top:8px;left:12px}#bar button{background:#0008;border-color:#fff4;width:auto;min-height:32px;padding:2px 14px}@media (max-width:900px){form{grid-template-columns:minmax(0,1fr)}.panel{position:static}}@media (max-width:640px){main{padding-top:24px}.maps{gap:10px}.map{grid-template-rows:none;grid-template-columns:112px 1fr}.map img{aspect-ratio:auto;height:100%}.map div{align-content:center;padding:12px 40px 12px 14px}.map p{display:none}.map i{top:8px;left:8px;right:auto}.map div{padding-right:14px}#bar{top:auto;bottom:32px}}</style>
    <script type="module" crossorigin src="/tiny-fps/assets/index-Cd4Xvpfv.js"></script>
  </head>
  <body>
    <main id="menu">
      <header>
        <h1>TINY FPS</h1>
        <p>A tiny multiplayer parkour shooter in the browser.</p>
      </header>
      <form id="form">
        <fieldset id="maps">
          <legend>Map</legend>
          <div class="maps">
            <label class="map">
              <input type="radio" name="map" value="highline" checked />
              <img
                src="/tiny-fps/assets/highline-B5U9pnC4.jpg"
                alt="The red tower's roof on Highline, the city in the haze"
              />
              <i>✓</i>
              <div>
                <em></em>
                <strong></strong>
                <p></p>
              </div>
            </label>
            <label class="map">
              <input type="radio" name="map" value="tranquility" />
              <img
                src="/tiny-fps/assets/tranquility-B2FTunqB.jpg"
                alt="A combat ship on its pad by the red dome of Tranquility, mountains on the crater's horizon, the Earth in a black sky"
              />
              <i>✓</i>
              <div>
                <em></em>
                <strong></strong>
                <p></p>
              </div>
            </label>
          </div>
        </fieldset>
        <section class="panel" aria-label="Game settings">
          <div class="mode">
            <b>CTF</b>
            <strong>Capture the flag</strong>
            <span>First to 3 captures, or the lead after 8 minutes</span>
          </div>
          <label class="field"
            ><span class="label">Your name</span>
            <input name="name" maxlength="16" required autocomplete="nickname" spellcheck="false"
          /></label>
          <fieldset id="bots">
            <legend>Bots</legend>
            <div class="seg">
              <label><input type="radio" name="bots" value="0" />None</label>
              <label><input type="radio" name="bots" value="4" />2 v 2</label>
              <label><input type="radio" name="bots" value="8" />4 v 4</label>
            </div>
            <div id="skill">
              <label class="level" for="level"
                ><span>Level</span><output id="skill-name" for="level"></output
              ></label>
              <input id="level" type="range" name="skill" min="0" max="7" step="1" />
              <div class="ends" aria-hidden="true"><span>Novice</span><span>Godlike</span></div>
            </div>
            <p class="hint" id="bots-hint" aria-live="polite"></p>
          </fieldset>
          <fieldset>
            <legend>Play</legend>
            <div class="seg">
              <label><input type="radio" name="mode" value="local" />In this browser</label>
              <label><input type="radio" name="mode" value="server" />On a server</label>
            </div>
            <p class="hint" id="mode-hint" aria-live="polite"></p>
            <label class="field" id="url" hidden
              ><span class="label">Server URL</span>
              <input name="url" type="url" value="ws://localhost:8787/demo" spellcheck="false"
            /></label>
          </fieldset>
          <div class="go">
            <button id="join">Play</button>
            <p id="summary" aria-live="polite"></p>
          </div>
        </section>
      </form>
      <p class="keys">
        Pick your character on the next screen. <kbd>Esc</kbd> in the game lists every key.
      </p>
    </main>
    <div id="game" hidden></div>
    <div id="bar" hidden>
      <span id="status"></span>
      <button id="leave" type="button">Leave</button>
    </div>
  </body>
</html>
